; No limit locally: the v2 test suite exceeds 700 MB when run sequentially
memory_limit=-1
max_execution_time=60
upload_max_filesize=32M
post_max_size=32M
date.timezone=Europe/Paris

; APCu is disabled in CLI by default, but the security.authenticator.cache.expired_links
; cache (ApcuAdapter) is used by tests and console commands
apc.enable_cli=1
