server {
    listen 8443 ssl;
    server_name console.minio.vault.local;

    ssl_certificate     /etc/nginx/certs/vault.local.crt;
    ssl_certificate_key /etc/nginx/certs/vault.local.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    ignore_invalid_headers off;
    proxy_buffering off;

    # Dynamic DNS resolution through Docker's internal DNS
    resolver 127.0.0.11 valid=30s;

    location / {
        set $upstream http://vault-minio:9001;
        proxy_pass $upstream;
        # $http_host keeps the :8443 port: the console checks it against the Origin of its
        # WebSocket (object browser), which stays stuck on "Loading…" without it
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # nginx is the only entry point: overwrite instead of appending, so it cannot be spoofed
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 80;
    server_name console.minio.vault.local;
    # HTTPS listens on 8443
    return 301 https://$host:8443$request_uri;
}
