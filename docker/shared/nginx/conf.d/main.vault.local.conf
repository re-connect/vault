server {
    listen 8443 ssl;
    server_name main.vault.local;

    ssl_certificate     /etc/nginx/certs/vault.local.crt;
    ssl_certificate_key /etc/nginx/certs/vault.local.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Dynamic DNS resolution through Docker's internal DNS
    resolver 127.0.0.11 valid=30s;

    location / {
        set $upstream http://vault-main:8010;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # nginx is the only entry point: overwrite client-supplied forwarding headers
        # instead of appending to them, so they cannot be spoofed
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
    }
}

server {
    listen 80;
    server_name main.vault.local;
    # HTTPS listens on 8443
    return 301 https://$host:8443$request_uri;
}

