name: vault-nginx

services:
  nginx:
    container_name: vault-nginx
    image: nginx:alpine
    ports:
      # Bound to localhost only
      - "127.0.0.1:8180:80"
      # Same port inside and outside: https://*.vault.local:8443 must work from the
      # browser AND from the app containers (MinIO presigned URLs, see minio.vault.local.conf)
      - "127.0.0.1:8443:8443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/entrypoint.sh:/entrypoint.sh:ro
      - nginx-certs:/etc/nginx/certs
    entrypoint: [ "/bin/sh", "/entrypoint.sh" ]
    networks:
      vault_nginx:
        aliases:
          - minio.vault.local
          - main.vault.local
          - dev.vault.local
    restart: unless-stopped

volumes:
  nginx-certs:

networks:
  vault_nginx:
    name: vault_nginx
